<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Desenvolvedor digitando código" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14110a"/><stop offset="1" stop-color="#0b0b0b"/></linearGradient>
    <linearGradient id="y" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF4B8"/><stop offset=".55" stop-color="#F6DE6E"/><stop offset="1" stop-color="#E4BE2A"/></linearGradient>
  </defs>
  <style>
    .line{transform-box:fill-box;transform-origin:0 50%;animation:type 9s steps(14) infinite;transform:scaleX(0)}
    @keyframes type{0%{transform:scaleX(0)}12%{transform:scaleX(1)}88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
    .l1{animation-delay:0s}.l2{animation-delay:.6s}.l3{animation-delay:1.2s}.l4{animation-delay:1.8s}.l5{animation-delay:2.4s}.l6{animation-delay:3s}.l7{animation-delay:3.6s}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .handA{animation:tap .22s ease-in-out infinite alternate;transform-origin:190px 200px}
    .handB{animation:tap .3s ease-in-out infinite alternate-reverse;transform-origin:185px 198px}
    @keyframes tap{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
    .head{animation:bob 1.2s ease-in-out infinite alternate}
    @keyframes bob{to{transform:translateY(2.5px)}}
    .eye{transform-box:fill-box;transform-origin:center;animation:eye 4s infinite}
    @keyframes eye{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
    .float{animation:fl 4s ease-in-out infinite alternate}
    .f2{animation-delay:-1.3s}.f3{animation-delay:-2.6s}
    @keyframes fl{to{transform:translateY(-10px)}}
    .steam{animation:st 2.4s ease-in-out infinite;opacity:0}
    .s2{animation-delay:.8s}
    @keyframes st{0%{opacity:0;transform:translateY(6px)}50%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
    .tw{animation:tw 3s ease-in-out infinite alternate}
    @keyframes tw{from{opacity:.15}to{opacity:.8}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.line{transform:scaleX(1)}}
  </style>
  <rect width="640" height="300" rx="22" fill="url(#bg)"/>
  <g fill="#F6DE6E"><circle class="tw" cx="60" cy="40" r="2"/><circle class="tw" cx="300" cy="28" r="1.6" style="animation-delay:-1s"/><circle class="tw" cx="590" cy="250" r="2" style="animation-delay:-2s"/><circle class="tw" cx="40" cy="170" r="1.5" style="animation-delay:-.5s"/></g>

  <!-- balões flutuantes -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" text-anchor="middle">
    <g class="float"><rect x="70" y="46" width="62" height="24" rx="12" fill="url(#y)"/><text x="101" y="62" fill="#111">Python</text></g>
    <g class="float f2"><rect x="160" y="26" width="44" height="24" rx="12" fill="#1f2937" stroke="#F6DE6E"/><text x="182" y="42" fill="#F6DE6E">SQL</text></g>
    <g class="float f3"><rect x="228" y="52" width="38" height="24" rx="12" fill="#1f2937" stroke="#F6DE6E"/><text x="247" y="68" fill="#F6DE6E">ML</text></g>
  </g>

  <!-- monitor -->
  <rect x="352" y="48" width="260" height="162" rx="12" fill="#0d1117" stroke="#3a3320" stroke-width="2"/>
  <rect x="352" y="48" width="260" height="22" rx="12" fill="#171b22"/>
  <circle cx="368" cy="59" r="4" fill="#F6DE6E"/><circle cx="382" cy="59" r="4" fill="#E4BE2A"/><circle cx="396" cy="59" r="4" fill="#555"/>
  <rect x="474" y="210" width="16" height="14" fill="#2a2a2a"/><rect x="450" y="222" width="64" height="6" rx="3" fill="#2a2a2a"/>
  <g>
    <rect class="line l1" x="372" y="84" width="90" height="7" rx="3.500" fill="#F6DE6E"/>
    <rect class="line l2" x="386" y="100" width="130" height="7" rx="3.500" fill="#e6edf3"/>
    <rect class="line l3" x="386" y="116" width="70" height="7" rx="3.500" fill="#7ee0a3"/>
    <rect class="line l4" x="400" y="132" width="150" height="7" rx="3.500" fill="#79c0ff"/>
    <rect class="line l5" x="400" y="148" width="100" height="7" rx="3.500" fill="#e6edf3"/>
    <rect class="line l6" x="386" y="164" width="60" height="7" rx="3.500" fill="#F6DE6E"/>
    <rect class="line l7" x="372" y="180" width="110" height="7" rx="3.500" fill="#e6edf3"/>
    <rect class="cursor" x="488" y="178" width="7" height="11" fill="#F6DE6E"/>
  </g>

  <!-- cadeira e pernas -->
  <rect x="104" y="232" width="86" height="12" rx="6" fill="#2a2a2a"/>
  <rect x="140" y="244" width="8" height="40" fill="#2a2a2a"/><rect x="118" y="282" width="52" height="7" rx="3.500" fill="#2a2a2a"/>
  <rect x="128" y="228" width="108" height="22" rx="11" fill="#2b3a55"/>
  <rect x="216" y="228" width="22" height="58" rx="11" fill="#2b3a55"/>
  <rect x="210" y="280" width="40" height="12" rx="6" fill="#e6edf3"/>

  <!-- corpo -->
  <rect x="112" y="140" width="68" height="100" rx="26" fill="url(#y)"/>
  <rect x="112" y="162" width="14" height="40" rx="7" fill="#E4BE2A" opacity=".5"/>

  <!-- cabeça -->
  <g class="head">
    <circle cx="150" cy="112" r="27" fill="#f0c8a4"/>
    <path d="M122 110c-2-22 14-34 32-31 14 2 24 12 22 26-8-12-22-14-38-8-6 2-12 6-16 13z" fill="#2a1d12"/>
    <path d="M120 108a30 30 0 0 1 60 0" fill="none" stroke="#e6edf3" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <rect x="114" y="104" width="12" height="22" rx="6" fill="#e6edf3"/>
    <ellipse class="eye" cx="166" cy="114" rx="3" ry="4" fill="#111"/>
    <path d="M164 128q6 4 11 0" fill="none" stroke="#7a4b2a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- braços e mãos -->
  <g class="handB"><path d="M166 166L192 198L262 210" fill="none" stroke="#E4BE2A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="264" cy="210" r="7.500" fill="#f0c8a4"/></g>
  <g class="handA"><path d="M160 164L186 200L250 212" fill="none" stroke="#F6DE6E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="254" cy="212" r="7.500" fill="#f0c8a4"/></g>

  <!-- mesa e teclado -->
  <rect x="236" y="214" width="126" height="9" rx="4" fill="#cfcfcf"/>
  <rect x="20" y="222" width="600" height="12" rx="6" fill="#3b2f12"/>
  <rect x="60" y="234" width="10" height="56" fill="#2a2a2a"/><rect x="570" y="234" width="10" height="56" fill="#2a2a2a"/>

  <!-- café -->
  <rect x="520" y="194" width="26" height="28" rx="5" fill="#e6edf3"/><path d="M546 200h8a7 7 0 0 1 0 14h-8" fill="none" stroke="#e6edf3" stroke-width="4"/>
  <path class="steam" d="M527 188q-4-8 0-14" fill="none" stroke="#e6edf3" stroke-width="2.500" stroke-linecap="round"/>
  <path class="steam s2" d="M537 188q-4-8 0-14" fill="none" stroke="#e6edf3" stroke-width="2.500" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
